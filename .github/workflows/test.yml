name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: macos-latest
            python-version: "3.13"

    steps:
      - name: Check out the source and LinearPartition
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          python-version: ${{ matrix.python-version }}

      - name: Build MountainCentroid solvers
        run: make

      - name: Build LinearPartition
        run: make -C vendor/LinearPartition

      - name: Install locked dependencies
        run: uv sync --frozen --extra test --extra analysis

      - name: Run tests
        run: uv run --frozen --extra test pytest

      - name: Smoke-test the command-line interface
        run: |
          uv run --frozen mountain-centroid --seq GGGAAAUUCCC
          uv run --frozen mountain-centroid --seq GGGAAAUUCCC --alpha 0 --alpha 0.23 --alpha 1
          uv run --frozen mountain-centroid --seq GGGAAAUUCCC --bpp-backend linearpartition

      - name: Regenerate the demonstration
        run: uv run --frozen --extra analysis python examples/plot_demo.py --output ci-demo.png
